name: Build SHITWAVE

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install X11 development package
        run: sudo apt-get update && sudo apt-get install -y libx11-dev cmake g++
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Smoke test the binary
        run: test -x build/shitwave
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: shitwave-linux-x86_64
          path: build/shitwave

name: Release SHITWAVE

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libx11-dev cmake g++

      - name: Build Linux binary
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel

      - name: Package Linux binary
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist/SHITWAVE-v${VERSION}-linux-x86_64
          cp build/shitwave dist/SHITWAVE-v${VERSION}-linux-x86_64/
          tar -C dist -czf dist/SHITWAVE-v${VERSION}-linux-x86_64.tar.gz SHITWAVE-v${VERSION}-linux-x86_64

      - name: Package web build
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cp -r web dist/SHITWAVE-v${VERSION}-web
          tar -C dist -czf dist/SHITWAVE-v${VERSION}-web.tar.gz SHITWAVE-v${VERSION}-web

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: SHITWAVE ${{ github.ref_name }}
          body: |
            SHITWAVE release.

            - Linux binary: `SHITWAVE-${{ github.ref_name }}-linux-x86_64.tar.gz`
            - Static web build: `SHITWAVE-${{ github.ref_name }}-web.tar.gz`
          files: |
            dist/SHITWAVE-${{ github.ref_name }}-linux-x86_64.tar.gz
            dist/SHITWAVE-${{ github.ref_name }}-web.tar.gz
